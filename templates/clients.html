<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes · Huawei Cloud Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20261007" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="h-full app-body font-sans antialiased">
  <div class="flex h-full">
    {% with active="clientes" %}{% include "_sidebar.html" %}{% endwith %}

    <div class="flex-1 flex flex-col min-w-0">
      {% include "_mobile_nav.html" %}
      <header class="app-header px-4 md:px-6 py-3">
        <div class="flex items-center gap-3">
          <div class="min-w-0 flex-1">
            <nav id="breadcrumb" aria-label="Ruta" class="crumbs"></nav>
            <h1 id="title" class="text-base font-bold leading-tight truncate text-slate-900 dark:text-white">Inicio</h1>
          </div>
          <button id="btnRefresh" title="Actualizar" class="icon-btn"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
          <button id="btnDark" title="Modo claro/oscuro" class="icon-btn"><i data-lucide="moon" class="w-4 h-4"></i></button>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto">
        <div class="max-w-screen-2xl mx-auto p-4 md:p-6 space-y-5">
          <div id="alerts" class="space-y-3"></div>
          <div id="view" class="space-y-5"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/clients.js?v=20261007"></script>
  <script src="/static/shell.js?v=20261007"></script>
</body>
</html>
